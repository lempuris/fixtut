# FIX Initiator Configuration (Client)
# This represents a client connecting to the exchange

# Connection settings
SocketConnectHost=localhost
SocketConnectPort=9876
BeginString=FIX.4.4
SenderCompID=CLIENT
TargetCompID=EXCHANGE
HeartBtInt=30

# Session settings
StartTime=00:00:00
EndTime=23:59:59
UseDataDictionary=Y
DataDictionary=FIX44.xml
ReconnectInterval=5

# Storage settings
FileStorePath=./fix-store/initiator
FileLogPath=./fix-logs/initiator

# Performance settings
ValidateUserDefinedFields=N
ValidateFieldsOutOfOrder=N
ValidateFieldsHaveValues=Y

# Logging
FileIncludeMilliseconds=Y
FileIncludeTimestampForMessages=Y