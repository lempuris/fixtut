# FIX Acceptor Configuration (Exchange Simulator)
# This simulates an exchange that receives orders

# Connection settings
SocketAcceptPort=9876
BeginString=FIX.4.4
SenderCompID=EXCHANGE
TargetCompID=CLIENT
HeartBtInt=30

# Session settings
StartTime=00:00:00
EndTime=23:59:59
UseDataDictionary=Y
DataDictionary=FIX44.xml

# Storage settings
FileStorePath=./fix-store/acceptor
FileLogPath=./fix-logs/acceptor

# Performance settings
ValidateUserDefinedFields=N
ValidateFieldsOutOfOrder=N
ValidateFieldsHaveValues=Y
CheckLatency=Y
MaxLatency=3000

# Logging
FileIncludeMilliseconds=Y
FileIncludeTimestampForMessages=Y